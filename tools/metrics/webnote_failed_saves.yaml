# Saves whose Datastore transaction failed, or that were too large to store
# (saveHandler() in server.go logs "Failed to save workspace" for both).
description: Webnote saves that failed in the transaction
filter: >-
  log_id("stdout") AND resource.type="gae_app"
  AND jsonPayload.message="Failed to save workspace"
metricDescriptor:
  metricKind: DELTA
  valueType: INT64
  unit: "1"
