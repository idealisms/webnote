# Webnote (see server.go). Deploy with ./deploy.sh.
runtime: go127

automatic_scaling:
  max_instances: 1

handlers:
- url: /webnote/
  static_files: index.html
  upload: index.html

- url: /robots\.txt
  static_files: robots.txt
  upload: robots\.txt
- url: /webnote/webnote_favicon\.ico
  static_files: webnote_favicon.ico
  upload: webnote_favicon\.ico
# Browsers ask for /favicon.ico on pages without an icon link (the feed).
- url: /favicon\.ico
  static_files: webnote_favicon.ico
  upload: webnote_favicon\.ico
# icons/: the SVG favicon, the PNGs for phones and the web manifest (see
# tools/make_icons.py).
- url: /webnote/icons/manifest\.webmanifest
  static_files: icons/manifest.webmanifest
  upload: icons/manifest\.webmanifest
  mime_type: application/manifest+json
- url: /webnote/icons
  static_dir: icons
- url: /webnote/style\.css
  static_files: style.css
  upload: style\.css
- url: /webnote/objects\.js
  static_files: objects.js
  upload: objects\.js
- url: /webnote/webnote\.js
  static_files: webnote.js
  upload: webnote\.js
- url: /webnote/images
  static_dir: images

- url: /.*
  script: auto
